[project]
name = "fertilizer-prediction"
version = "0.1.0"
description = "Rebuild of the Kaggle Playground S5E6 fertilizer recommendation notebook (M1)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "joblib==1.4.2",
    "lightgbm==4.5.0",
    "matplotlib==3.9.2",
    "mlflow==2.22.0",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "sqlalchemy==2.0.41",
    "xgboost==2.1.4",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "jupyterlab==4.3.5",
    "pytest==8.3.5",
]
api = [
    "fastapi==0.115.12",
    "httpx==0.27.2",
    "pydantic==2.10.6",
    "uvicorn==0.34.0",
]

